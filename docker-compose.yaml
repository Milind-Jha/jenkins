version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: dataprivacyvaulttrial
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  application:
    build: .
    container_name: spring-app
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8282:8282"
    volumes:
      - ./application.properties:/app/application.properties
    environment:
      SPRING_CONFIG_LOCATION: /app/application.properties
      SERVER_PORT: 8282
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/dataprivacyvaulttrial
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345678
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data:
